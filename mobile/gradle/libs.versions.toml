[versions]
exifinterface = "1.4.1"
coil = "2.7.0"
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.9.6"
androidx-datastore = "1.1.7"
androidx-work = "2.12.0"
androidx-testExt = "1.3.0"
compose-bom = "2026.09.00"
# Compose Multiplatform, for the one screen both phones share: the reels
# viewer and its players. On Android these artifacts resolve to the same
# androidx Compose the BoM above pins; on iOS they bring Compose with them.
compose-multiplatform = "1.12.1"
# ExoPlayer, behind the reels. Same version Samadhan plays them with.
media3 = "1.11.1"
coroutines = "1.10.2"
firebase-bom = "34.19.0"
google-services = "4.5.0"
junit = "4.13.2"
kotlin = "2.4.20"
sqldelight = "2.1.0"
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
maps-compose = "6.4.1"
play-services-maps = "19.0.0"
play-services-location = "21.3.0"
play-app-update = "2.1.0"

[libraries]
# Places (New) is plain HTTPS + JSON, so the client lives in shared rather than
# being written twice against two native SDKs.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# The map under the address search. Compose has no map of its own, and an
# AndroidView around the raw MapView means owning nine lifecycle callbacks.
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "maps-compose" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "play-services-maps" }
# The "Turn on location" pop-up (SettingsClient), so a worker never has to leave the form.
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
# "Update required" asks Play whether THIS phone can get the update before blocking it,
# and runs Google's own in-app update screen instead of sending people to the store.
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "play-app-update" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
# Uploads recordings after the app is closed, survives reboots, and waits for
# signal on its own. The recorder service cannot do this: it ends with the meeting.
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }

# Jetpack Compose (Android) — versions aligned by the BoM
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }

# The reels' player pool: ExoPlayer, plus the shared disk cache it fills ahead
# of the swipe (datasource + database). No transformer or effect — nothing here
# edits video, it only plays it.
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-database = { module = "androidx.media3:media3-database", version.ref = "media3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-playServices = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Firebase (Android) — versions aligned by the BoM
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
# Auth is the only Firebase library. The notetaker's data goes
# through the CRM API on Render.
firebase-auth = { module = "com.google.firebase:firebase-auth" }
# Bakes EXIF rotation into the pixels — without it every portrait photo
# renders on its side in Compose, SwiftUI and the Storage console alike.
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
# Loads the uploaded photo back from its https URL. Compose has no network
# image loader of its own, and a hand-rolled one is a cache nobody maintains.
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-androidDriver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-nativeDriver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqliteDriver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

[plugins]
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "google-services" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
